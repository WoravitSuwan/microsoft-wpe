{% extends "base.html" %}
{% block content %}
<div class="card login-box">
  <h1>เปลี่ยนรหัสผ่าน</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <p><label>รหัสผ่านเดิม</label><input type="password" name="old" required></p>
    <p><label>รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)</label><input type="password" name="new" required minlength="6"></p>
    <button class="btn primary" type="submit">บันทึก</button>
  </form>
</div>
{% endblock %}
