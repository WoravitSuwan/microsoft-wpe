{% extends "base.html" %}
{% block content %}
<div class="card login-box">
  <h1>ตั้งค่าครั้งแรก</h1>
  <p class="sub">สร้างบัญชีผู้ดูแลระบบ (นำเข้าไฟล์ได้ทุกเจ้าของ และสร้างบัญชีให้พนักงานสอบสวนแต่ละคน)</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <p><label>ชื่อผู้ใช้</label><input type="text" name="username" required autofocus></p>
    <p><label>ชื่อที่แสดง</label><input type="text" name="display_name" placeholder="เช่น ผู้ดูแลระบบ กก.1"></p>
    <p><label>รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label><input type="password" name="password" required minlength="6"></p>
    <button class="btn primary" type="submit">สร้างผู้ดูแลระบบ</button>
  </form>
</div>
{% endblock %}
