{% extends "_auth.html" %}
{% block title %}สมัครผู้ดูแลระบบ · {{ unit_short }}{% endblock %}
{% block card %}
<h1>สมัครผู้ดูแลระบบ (คนแรก)</h1>
<p class="sub">ระบบยังไม่มีบัญชีใด — ผู้ที่สมัครคนแรกจะเป็น<b>ผู้ดูแลระบบ</b> ใช้สร้างรหัสลงทะเบียน/บัญชีให้คนในกอง</p>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <p><label>ชื่อผู้ใช้</label><input type="text" name="username" required autofocus autocapitalize="none"></p>
  <p><label>ชื่อที่แสดง</label><input type="text" name="display_name" placeholder="เช่น ผู้ดูแลระบบ {{ unit_short }}"></p>
  <p><label>รหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label><input type="password" name="password" required minlength="6" autocomplete="new-password"></p>
  <button class="btn primary" type="submit">สมัครเป็นผู้ดูแลระบบ</button>
</form>
{% endblock %}
