{% extends "_auth.html" %}
{% block title %}เข้าสู่ระบบ · {{ unit_short }}{% endblock %}
{% block card %}
<h1>เข้าสู่ระบบ</h1>
<p class="sub">แต่ละบัญชีเห็นเฉพาะข้อมูลคดีของตัวเอง</p>
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <p><label>ชื่อผู้ใช้</label><input type="text" name="username" required autofocus autocomplete="username" autocapitalize="none"></p>
  <p><label>รหัสผ่าน</label><input type="password" name="password" required autocomplete="current-password"></p>
  <button class="btn primary" type="submit">เข้าสู่ระบบ</button>
</form>
{% if register_open %}<div class="auth-alt">ยังไม่มีบัญชี? <a href="{{ url_for('register') }}">สมัครสมาชิก</a></div>{% endif %}
{% endblock %}
