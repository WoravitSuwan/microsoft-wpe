{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:560px">
  <h1>เพิ่ม Case ID</h1>
  <p class="sub">สำหรับคดีที่ไม่มีในไฟล์ thaipoliceonline (เช่น มีใน CCMS หรือระบบ C.) ของ {{ owner_label(owner) }}</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <p><label>Case ID</label><input type="text" name="case_id" required autofocus></p>
    <p><label>ผู้เสียหาย</label><input type="text" name="victim"></p>
    <button class="btn primary">เพิ่มและกรอกรายละเอียดต่อ</button>
    <a class="btn" href="{{ url_for('owner_view', owner_id=owner.id) }}">ยกเลิก</a>
  </form>
</div>
{% endblock %}
